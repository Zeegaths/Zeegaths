name: Pull latest Medium posts

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pull Medium feed into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@zarahgathoni76"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          item_exec: |
            const max = 60;
            if (post.title.length > max) {
              let t = post.title.slice(0, max);
              const cut = t.lastIndexOf(' ');
              if (cut > 30) { t = t.slice(0, cut); }
              t = t.replace(/[\s,;:.\-]+$/, '').replace(/\s+(and|or|the|a|an|of|in|to|is|with|for)$/i, '');
              post.title = t + '...';
            }
          date_format: "mmm yyyy"
          commit_message: "chore: refresh latest writing"
