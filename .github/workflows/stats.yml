name: Build GitHub stats card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render stats.svg from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/build_stats.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "No change to stats.svg"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh stats card"
          git push
