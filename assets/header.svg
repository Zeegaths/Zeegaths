<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Zarah Gathoni, Nairobi-based blockchain engineer">
  <title>Zarah Gathoni, blockchain engineer</title>

  <defs>
    <clipPath id="panel"><rect x="0" y="0" width="1000" height="280" rx="18"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="58"/></filter>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6F432"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6D28D9" stroke-width="1" opacity="0.09"/>
    </pattern>

    <clipPath id="t0"><rect x="68" y="158" height="30" width="409"><animate attributeName="width" values="0;409;409;0;0" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t1"><rect x="68" y="158" height="30" width="0"><animate attributeName="width" values="0;370;370;0;0" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="68" y="158" height="30" width="0"><animate attributeName="width" values="0;224;224;0;0" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="68" y="158" height="30" width="0"><animate attributeName="width" values="0;211;211;0;0" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="12s" repeatCount="indefinite"/></rect></clipPath>

    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace; }
      .name { font-size: 46px; font-weight: 700; fill: #FAFAFA; }
      .eyebrow { font-size: 13px; letter-spacing: 4.5px; fill: #8A8A96; }
      .role { font-size: 22px; fill: #E8E8EC; }
      .pill { font-size: 12px; letter-spacing: 1px; fill: #8A8A96; }
      .prompt { font-size: 22px; fill: #6D28D9; font-weight: 700; }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1000" height="280" fill="#0A0A0B"/>

    <g filter="url(#soft)" opacity="0.55">
      <circle r="120" fill="#6D28D9" cx="180" cy="60">
        <animate attributeName="cx" values="180;420;240;180" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;250;120;60" dur="23s" repeatCount="indefinite"/>
      </circle>
      <circle r="90" fill="#C6F432" opacity="0.5" cx="880" cy="230">
        <animate attributeName="cx" values="880;700;930;880" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;60;170;230" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle r="100" fill="#2563EB" opacity="0.35" cx="540" cy="270">
        <animate attributeName="cx" values="540;860;520;540" dur="27s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="270;200;40;270" dur="25s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1000" height="280" fill="url(#grid)"/>
    <rect width="1000" height="280" rx="18" fill="none" stroke="#26262E" stroke-width="1.5"/>

    <!-- orbit -->
    <g>
      <circle cx="852" cy="140" r="86" fill="none" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="0 852 140" to="360 852 140" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="852" cy="140" r="58" fill="none" stroke="#33333D" stroke-width="1.5"/>
      <circle cx="852" cy="140" r="26" fill="#0E0E12" stroke="#33333D" stroke-width="1.5"/>
      <text class="mono" x="852" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#C6F432">Z</text>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 852 140" to="360 852 140" dur="11s" repeatCount="indefinite"/>
        <circle cx="910" cy="140" r="5" fill="#C6F432"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="120 852 140" to="-240 852 140" dur="16s" repeatCount="indefinite"/>
        <circle cx="938" cy="140" r="4" fill="#6D28D9"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="240 852 140" to="600 852 140" dur="24s" repeatCount="indefinite"/>
        <circle cx="938" cy="140" r="3" fill="#FAFAFA" opacity="0.7"/>
      </g>
    </g>

    <!-- identity -->
    <text class="mono eyebrow" x="48" y="62">NAIROBI <tspan fill="#6D28D9">·</tspan> BLOCKCHAIN ENGINEER <tspan fill="#6D28D9">·</tspan> WEB3 GTM</text>

    <rect x="213" y="103" height="11" width="194" fill="#C6F432" opacity="0.85">
      <animate attributeName="width" values="0;194" dur="0.7s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <text class="mono name" x="48" y="112">ZARAH GATHONI</text>

    <!-- typing roles -->
    <text class="mono prompt" x="48" y="182">&gt;</text>
    <g>
      <g clip-path="url(#t0)">
        <text class="mono role" x="68" y="182">full-stack blockchain developer
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.225;0.25;1" dur="16s" begin="0s" repeatCount="indefinite"/>
        </text>
      </g>
      <g clip-path="url(#t1)">
        <text class="mono role" x="68" y="182" opacity="0">Web3 market entry strategist
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.225;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>
        </text>
      </g>
      <g clip-path="url(#t2)">
        <text class="mono role" x="68" y="182" opacity="0">BD &amp; partnerships
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.225;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>
        </text>
      </g>
      <g clip-path="url(#t3)">
        <text class="mono role" x="68" y="182" opacity="0">technical writer
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.225;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>
        </text>
      </g>

      <g>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.2351;1" dur="16s" begin="0s" repeatCount="indefinite"/>
        <rect x="70" y="164" width="11" height="23" fill="#C6F432">
          <animate attributeName="x" values="70;479;479;70;70" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.2351;1" dur="16s" begin="4s" repeatCount="indefinite"/>
        <rect x="70" y="164" width="11" height="23" fill="#C6F432">
          <animate attributeName="x" values="70;440;440;70;70" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.2351;1" dur="16s" begin="8s" repeatCount="indefinite"/>
        <rect x="70" y="164" width="11" height="23" fill="#C6F432">
          <animate attributeName="x" values="70;294;294;70;70" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.235;0.2351;1" dur="16s" begin="12s" repeatCount="indefinite"/>
        <rect x="70" y="164" width="11" height="23" fill="#C6F432">
          <animate attributeName="x" values="70;281;281;70;70" keyTimes="0;0.1;0.24;0.2401;1" dur="16s" begin="12s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- stat pills -->
    <g>
      <g>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
        <rect x="48" y="219" width="179" height="28" rx="14" fill="#121214" stroke="#2A2A32"/>
        <text class="mono pill" x="64" y="237">5 PRODUCTS SHIPPED</text>
      </g>
      <g>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.85s" fill="freeze"/>
        <rect x="239" y="219" width="147" height="28" rx="14" fill="#121214" stroke="#2A2A32"/>
        <text class="mono pill" x="255" y="237">10+ HACKATHONS</text>
      </g>
      <g>
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
        <rect x="398" y="219" width="116" height="28" rx="14" fill="#121214" stroke="#2A2A32"/>
        <text class="mono pill" x="414" y="237">9 ARTICLES</text>
      </g>
    </g>

    <rect x="0" y="277" width="1000" height="3" fill="url(#fade)" opacity="0.9"/>
  </g>
</svg>
