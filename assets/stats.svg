<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="GitHub statistics for Zeegaths">
  <title>Zeegaths on GitHub</title>
  <defs>
    <clipPath id="p"><rect width="1000" height="230" rx="18"/></clipPath>
    <clipPath id="bar"><rect x="48" y="150" width="904" height="14" rx="7"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .num { font-size: 40px; font-weight: 700; fill: #FAFAFA; }
      .lbl { font-size: 11px; letter-spacing: 2px; fill: #8A8A96; }
      .leg { font-size: 12px; fill: #B8B8C4; }
      .eyebrow { font-size: 11px; letter-spacing: 4px; fill: #5A5A66; }
    </style>
  </defs>
  <g clip-path="url(#p)">
    <rect width="1000" height="230" fill="#0A0A0B"/>
    <rect width="1000" height="230" rx="18" fill="none" stroke="#26262E" stroke-width="1.5"/>
    <text class="mono eyebrow" x="48" y="42">GITHUB <tspan fill="#6D28D9">·</tspan> UPDATED SEP 2026</text>
    <text class="mono num" x="48" y="98">178</text>
    <text class="mono lbl" x="48" y="120">PUBLIC REPOS</text>
    <text class="mono num" x="280" y="98">1</text>
    <text class="mono lbl" x="280" y="120">STARS EARNED</text>
    <text class="mono num" x="512" y="98">32</text>
