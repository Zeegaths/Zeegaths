<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="GitHub statistics for Zeegaths">
  <title>Zeegaths on GitHub</title>
  <defs>
    <clipPath id="p"><rect width="1000" height="230" rx="18"/></clipPath>
    <clipPath id="bar"><rect x="48" y="150" width="904" height="14" rx="7"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .num { font-size: 40px; font-weight: 700; fill: #FAFAFA; }
      .lbl { font-size: 11px; letter-spacing: 2px; fill: #8A8A96; }
      .leg { font-size: 12px; fill: #B8B8C4; }
      .eyebrow { font-size: 11px; letter-spacing: 4px; fill: #5A5A66; }
    </style>
  </defs>
  <g clip-path="url(#p)">
    <rect width="1000" height="230" fill="#0A0A0B"/>
    <rect width="1000" height="230" rx="18" fill="none" stroke="#26262E" stroke-width="1.5"/>
    <text class="mono eyebrow" x="48" y="42">GITHUB <tspan fill="#6D28D9">·</tspan> UPDATED SEP 2026</text>
    <text class="mono num" x="48" y="98">178</text>
    <text class="mono lbl" x="48" y="120">PUBLIC REPOS</text>
    <text class="mono num" x="358" y="98">32</text>
    <text class="mono lbl" x="358" y="120">FOLLOWERS</text>
    <text class="mono num" x="668" y="98">19</text>
    <text class="mono lbl" x="668" y="120">LANGUAGES USED</text>
    <g clip-path="url(#bar)">
      <rect x="48" y="150" width="904" height="14" fill="#15151B"/>
      <rect x="48.0" y="150" width="382.1" height="14" fill="#6D28D9"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.0s" fill="freeze"/></rect>
      <rect x="430.1" y="150" width="248.5" height="14" fill="#7C3AED"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.25s" fill="freeze"/></rect>
      <rect x="678.6" y="150" width="84.9" height="14" fill="#8B5CF6"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.42s" fill="freeze"/></rect>
      <rect x="763.5" y="150" width="64.1" height="14" fill="#A78BFA"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.47s" fill="freeze"/></rect>
      <rect x="827.6" y="150" width="38.7" height="14" fill="#93B80C"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.52s" fill="freeze"/></rect>
      <rect x="866.3" y="150" width="34.1" height="14" fill="#C6F432"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.54s" fill="freeze"/></rect>
      <rect x="900.4" y="150" width="51.6" height="14" fill="#3A3A46"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.57s" fill="freeze"/></rect>
    </g>
    <circle cx="53" cy="194" r="5" fill="#6D28D9"/>
    <text class="mono leg" x="66" y="198">Solidity <tspan fill="#5A5A66">42.3%</tspan></text>
    <circle cx="177" cy="194" r="5" fill="#7C3AED"/>
    <text class="mono leg" x="190" y="198">JavaScript <tspan fill="#5A5A66">27.5%</tspan></text>
    <circle cx="315" cy="194" r="5" fill="#8B5CF6"/>
    <text class="mono leg" x="328" y="198">Motoko <tspan fill="#5A5A66">9.4%</tspan></text>
    <circle cx="417" cy="194" r="5" fill="#A78BFA"/>
    <text class="mono leg" x="430" y="198">TypeScript <tspan fill="#5A5A66">7.1%</tspan></text>
    <circle cx="548" cy="194" r="5" fill="#93B80C"/>
    <text class="mono leg" x="561" y="198">Rust <tspan fill="#5A5A66">4.3%</tspan></text>
    <circle cx="635" cy="194" r="5" fill="#C6F432"/>
    <text class="mono leg" x="648" y="198">Python <tspan fill="#5A5A66">3.8%</tspan></text>
    <circle cx="737" cy="194" r="5" fill="#3A3A46"/>
    <text class="mono leg" x="750" y="198">Other <tspan fill="#5A5A66">5.7%</tspan></text>
