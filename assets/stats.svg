      <rect x="48.0" y="150" width="296.0" height="14" fill="#6D28D9"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.0s" fill="freeze"/></rect>
      <rect x="344.0" y="150" width="203.8" height="14" fill="#7C3AED"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.2s" fill="freeze"/></rect>
      <rect x="547.8" y="150" width="192.4" height="14" fill="#8B5CF6"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.33s" fill="freeze"/></rect>
      <rect x="740.2" y="150" width="65.8" height="14" fill="#A78BFA"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.46s" fill="freeze"/></rect>
      <rect x="806.0" y="150" width="49.7" height="14" fill="#93B80C"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.5s" fill="freeze"/></rect>
      <rect x="855.7" y="150" width="29.9" height="14" fill="#C6F432"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.54s" fill="freeze"/></rect>
      <rect x="885.6" y="150" width="66.4" height="14" fill="#3A3A46"><animate attributeName="height" values="0;14" dur="0.5s" begin="0.56s" fill="freeze"/></rect>
    </g>
    <circle cx="53" cy="194" r="5" fill="#6D28D9"/>
    <text class="mono leg" x="66" y="198">Solidity <tspan fill="#5A5A66">32.7%</tspan></text>
    <circle cx="177" cy="194" r="5" fill="#7C3AED"/>
    <text class="mono leg" x="190" y="198">Makefile <tspan fill="#5A5A66">22.5%</tspan></text>
    <circle cx="301" cy="194" r="5" fill="#8B5CF6"/>
    <text class="mono leg" x="314" y="198">JavaScript <tspan fill="#5A5A66">21.3%</tspan></text>
    <circle cx="439" cy="194" r="5" fill="#A78BFA"/>
    <text class="mono leg" x="452" y="198">Motoko <tspan fill="#5A5A66">7.3%</tspan></text>
    <circle cx="541" cy="194" r="5" fill="#93B80C"/>
