    <circle cx="672" cy="194" r="5" fill="#C6F432"/>
    <text class="mono leg" x="685" y="198">Rust <tspan fill="#5A5A66">3.3%</tspan></text>
    <circle cx="759" cy="194" r="5" fill="#3A3A46"/>
    <text class="mono leg" x="772" y="198">Other <tspan fill="#5A5A66">7.3%</tspan></text>
